name = "freelance-website"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./site"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/anfrage"]

